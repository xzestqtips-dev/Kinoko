name: Kinoko build
on: workflow_dispatch

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Patch
        run: |
          sed -i '1i #include <algorithm>' source/egg/math/Quat.hh
          grep -rl -- '-Werror' configure.py CMakeLists.txt 2>/dev/null | xargs -r sed -i 's/-Werror//g'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          ./configure.py
          ninja

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Patch
        run: |
          sed -i '1i #include <algorithm>' source/egg/math/Quat.hh
          grep -rl -- '-Werror' configure.py CMakeLists.txt 2>/dev/null | xargs -r sed -i 's/-Werror//g'
      - name: Build libkinoko for arm64
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $NDK"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_FLAGS="-include algorithm -include bit -ferror-limit=0 -Wno-error"
          cmake --build build-android --target libkinoko -- -k 0 2>&1 | tee build.log || true
          echo "===== ERROR SUMMARY ====="
          grep -E "error:" build.log | sed 's#/home/runner/work/Kinoko/Kinoko/##' | sort | uniq -c | sort -rn | head -40
          echo "===== LIBRARIES ====="
          find build-android -name "*.a" -o -name "*.so"
          test -n "$(find build-android -name '*.a' -o -name '*.so')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinoko-android
          path: |
            build-android/**/*.a
            build-android/**/*.so
