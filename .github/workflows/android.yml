name: Kinoko build
on: workflow_dispatch

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Patch
        run: |
          sed -i '1i #include <algorithm>' source/egg/math/Quat.hh
          grep -rl -- '-Werror' configure.py CMakeLists.txt 2>/dev/null | xargs -r sed -i 's/-Werror//g'
          cat > "$GITHUB_WORKSPACE/compat_android.hh" << 'EOF'
          #pragma once
          #include <version>
          #include <cstddef>
          #include <iterator>
          #include <ranges>
          #include <tuple>
          #include <type_traits>
          #include <utility>
          #ifndef __cpp_lib_ranges_enumerate
          namespace std::ranges::views {
          template <class R>
          struct enumerate_compat_view {
              R m_range;
              struct iterator {
                  using It = decltype(std::begin(std::declval<std::remove_reference_t<R> &>()));
                  It it;
                  std::ptrdiff_t i;
                  auto operator*() const {
                      return std::tuple<std::ptrdiff_t, decltype(*std::declval<It &>())>(i, *it);
                  }
                  iterator &operator++() { ++it; ++i; return *this; }
                  bool operator!=(const iterator &o) const { return it != o.it; }
              };
              auto begin() { return iterator{std::begin(m_range), 0}; }
              auto end() { return iterator{std::end(m_range), 0}; }
          };
          template <class R>
          auto enumerate(R &&r) { return enumerate_compat_view<R>{std::forward<R>(r)}; }
          }
          #endif
          EOF
      - name: Build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_FLAGS="-include algorithm -include bit -include sstream -include $GITHUB_WORKSPACE/compat_android.hh -ferror-limit=0 -Wno-error -Wno-unknown-warning-option"
          cmake --build build-android -- -k 0 2>&1 | tee build.log || true
          echo "===== ERROR SUMMARY ====="
          grep -E "error:|undefined|multiple" build.log | sed 's#/home/runner/work/Kinoko/Kinoko/##' | sort | uniq -c | sort -rn | head -40
          echo "===== RESULT ====="
          find build-android -name "*.a" -o -name "kinoko" -type f
          test -n "$(find build-android -name kinoko -type f)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinoko-android
          path: |
            build-android/**/*.a
            build-android/**/kinoko
