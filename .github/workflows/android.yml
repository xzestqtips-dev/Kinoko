name: Kinoko build
on: workflow_dispatch

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build python3
          export CXX=g++-13 CC=gcc-13
          ./configure.py
          ninja

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build libkinoko for arm64
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $NDK"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23
          cmake --build build-android --target libkinoko
          find build-android -name "*.a" -o -name "*.so"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinoko-android
          path: |
            build-android/**/*.a
            build-android/**/*.so
